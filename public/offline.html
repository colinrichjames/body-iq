<head>

<title>Offline | Body IQ</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;padding:24px}

  h1{font-size:24px;margin:0 0 8px}
  p{color:#a1a1aa;line-height:1.5}

<body>
<main>
  <h1>You're offline</h1>
  <p>This page isn't saved on your phone yet. If you were in the middle of a workout, nothing is lost: the workout screen keeps your sets on this phone and saves them when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
